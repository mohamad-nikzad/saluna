# Disposable production-image rehearsal, independent of Salon development data.
name: saluna-cms-rehearsal
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: operator
      POSTGRES_DB: salon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the disposable Postgres password}
    volumes:
      - cms_database:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:35432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U operator -d salon']
      interval: 2s
      timeout: 5s
      retries: 30
  web:
    image: ${CMS_REHEARSAL_IMAGE:-saluna-web:bl-0092}
    environment:
      HOST: 0.0.0.0
      PORT: '3001'
      NODE_ENV: production
      CMS_DATABASE_URL: ${CMS_DATABASE_URL:?Set the disposable CMS database URL}
      EMDASH_ENCRYPTION_KEY: ${EMDASH_ENCRYPTION_KEY:?Generate a disposable EmDash key}
      EMDASH_SITE_URL: http://localhost:3301
      API_INTERNAL_URL: ${CMS_REHEARSAL_API_URL:-http://host.docker.internal:3302}
    volumes:
      - cms_media:/app/apps/web/.emdash/uploads
    ports:
      - '127.0.0.1:3301:3001'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/_emdash/api/setup/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  cms_database:
  cms_media:
