name: saluna-qa

x-runtime: &runtime
  restart: 'no'
  cpu_shares: 128
  pids_limit: 128
  logging:
    driver: json-file
    options: { max-size: '5m', max-file: '2' }

services:
  postgres:
    <<: *runtime
    image: postgres:16-alpine
    mem_limit: 256m
    cpus: 0.15
    environment:
      POSTGRES_DB: saluna_qa
      POSTGRES_USER: saluna_qa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?QA password required}
    command:
      ['postgres', '-c', 'shared_buffers=32MB', '-c', 'max_connections=25']
    volumes: ['qa_database:/var/lib/postgresql/data']
    networks:
      backend:
        aliases: [saluna-qa-postgres]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U saluna_qa -d saluna_qa']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *runtime
    image: saluna-qa-api:${QA_REVISION:?QA revision required}
    mem_limit: 512m
    cpus: 0.3
    env_file: .env.qa.local
    environment:
      {
        NODE_ENV: production,
        PORT: '3002',
        NODE_OPTIONS: '--max-old-space-size=320',
      }
    networks:
      backend:
        aliases: [saluna-qa-api]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    <<: *runtime
    image: saluna-qa-web:${QA_REVISION:?QA revision required}
    mem_limit: 384m
    cpus: 0.15
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3001'
      API_INTERNAL_URL: http://saluna-qa-api:3002
    networks:
      backend:
        aliases: [saluna-qa-web]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 12

  pwa:
    <<: *runtime
    image: saluna-qa-pwa:${QA_REVISION:?QA revision required}
    mem_limit: 64m
    cpus: 0.05
    networks:
      backend:
        aliases: [saluna-qa-pwa]
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 12

  gateway:
    <<: *runtime
    image: nginx:1.27-alpine
    mem_limit: 64m
    cpus: 0.05
    volumes: ['./gateway.conf:/etc/nginx/conf.d/default.conf:ro']
    networks: [production_gateway, backend]
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
      pwa: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/health']
      interval: 10s
      timeout: 5s
      retries: 12

  tools:
    <<: *runtime
    image: saluna-qa-tools:${QA_REVISION:?QA revision required}
    profiles: [tools]
    mem_limit: 512m
    cpus: 0.25
    env_file: .env.qa.local
    networks: [backend]

volumes:
  qa_database:

networks:
  backend: { internal: true }
  production_gateway:
    external: true
    name: saluna_saluna
